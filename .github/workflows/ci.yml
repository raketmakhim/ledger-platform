name: CI
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B test -DexcludedGroups=integration
      - name: Coverage summary
        run: |
          awk -F, 'NR>1 {m+=$8; c+=$9} END {printf "### Unit test coverage\nLines covered: %d of %d (%.1f%%)\n", c, m+c, 100*c/(m+c)}' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

  integration-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B test -Dgroups=integration
