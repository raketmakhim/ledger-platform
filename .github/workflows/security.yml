name: Security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # new vulnerabilities are published every week, even when the code has not changed
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  sbom-and-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # the CycloneDX plugin runs in generate-resources and writes target/classes/META-INF/sbom/application.cdx.json
      - name: Generate SBOM
        run: ./mvnw -B generate-resources
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: target/classes/META-INF/sbom/application.cdx.json
      # Pinned to a full commit, not a tag: in March 2026 an attacker moved 76 of the 77 trivy-action tags to
      # malicious commits. This commit is the v0.36.0 release (immutable, published after the incident).
      - name: Scan SBOM for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml
        with:
          scan-type: sbom
          scan-ref: target/classes/META-INF/sbom/application.cdx.json
          severity: HIGH,CRITICAL
          exit-code: '1'
          version: v0.76.0
