ledger:
  retry:
    # how often a transfer or deposit is run again after losing a clash with another request, and the pause scale
    max-attempts: 8
    backoff-millis: 10
spring:
  application:
    name: ledger-platform
  datasource:
    url: jdbc:postgresql://localhost:5432/ledger
    username: ledger
    password: ledger
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # update rows in primary-key order, so two requests changing the same accounts cannot deadlock
        order_updates: true